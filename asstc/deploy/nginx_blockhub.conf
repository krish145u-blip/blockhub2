# BLOCKHUB Production Nginx Configuration with HTTPS (Let's Encrypt SSL)
server {
    listen 80;
    listen [::]:80;
    server_name blockhub.example.com www.blockhub.example.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blockhub.example.com www.blockhub.example.com;

    # Let's Encrypt TLS Certificates (Provision via: sudo certbot --nginx -d blockhub.example.com)
    ssl_certificate /etc/letsencrypt/live/blockhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockhub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enforce 6 MB request body cap (Safe Image Uploads <= 5 MB)
    client_max_body_size 6M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets & validated image uploads (never execute scripts from uploads)
    location /static/ {
        alias /opt/blockhub/frontend/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to FastAPI Uvicorn workers
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
